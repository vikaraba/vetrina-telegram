<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Узнать цену · Каталог Анастасии</title>
  <meta name="description" content="Откройте чат с Анастасией: ссылка на выбранный товар будет добавлена к сообщению автоматически.">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f7f7f3;color:#15231d;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    main{width:min(100%,420px);background:white;border:1px solid #dfe5df;border-radius:24px;padding:32px;box-shadow:0 12px 40px #15231d10}
    h1{font-size:28px;line-height:1.15;margin:0 0 16px}p{margin:0 0 24px;color:#53605a}a{display:block;padding:16px 20px;border-radius:14px;background:#15231d;color:white;text-align:center;text-decoration:none;font-weight:650}a:focus-visible{outline:3px solid #94c9aa;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>Открываем чат с Анастасией</h1>
    <p id="status">Ссылка на товар будет добавлена к сообщению автоматически.</p>
    <a id="open" href="https://t.me/buyer_rome">Открыть чат</a>
  </main>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const channel = query.get("c") || "";
      const post = query.get("p") || "";
      const signature = query.get("s") || "";
      if (!/^\d{5,20}$/.test(channel) || !/^[1-9]\d{0,15}$/.test(post) || !/^[a-f0-9]{32}$/.test(signature)) {
        document.getElementById("status").textContent = "Ссылка на товар недействительна. Напишите Анастасии напрямую.";
        return;
      }
      const target = new URL("https://dbgcpgteuwkxqjgvppfp.supabase.co/functions/v1/telegram-product-contact");
      target.searchParams.set("c", channel);
      target.searchParams.set("p", post);
      target.searchParams.set("s", signature);
      document.getElementById("open").href = target.href;
      location.replace(target.href);
    })();
  </script>
</body>
</html>
