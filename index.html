<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ON · Anastasiia Buyer</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:var(--tg-theme-bg-color,#f6f6f1);--text:var(--tg-theme-text-color,#171814);--muted:var(--tg-theme-hint-color,#72766d);--card:var(--tg-theme-secondary-bg-color,#fff);--button:var(--tg-theme-button-color,#171814);--button-text:var(--tg-theme-button-text-color,#fff)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:24px 16px 18px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted)}h1{margin:6px 0;font-size:28px;line-height:1}.intro{margin:0;color:var(--muted)}main{padding:0 12px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{border:0;border-radius:16px;background:var(--card);padding:0;overflow:hidden;text-align:left;color:inherit}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff}.copy{padding:11px}.brand{font-size:10px;letter-spacing:.1em;color:var(--muted)}h2{font-size:13px;line-height:1.25;margin:4px 0 7px}.price{font-size:17px;font-weight:750}.tag{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:999px;background:#edf0e8;font-size:10px;color:#596055}.empty{grid-column:1/-1;padding:44px 14px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;width:min(94vw,520px);max-height:90vh;color:var(--text);background:var(--card)}dialog::backdrop{background:#0008}.detail{padding:17px}.hero{width:100%;max-height:330px;object-fit:contain;background:#fff}.notice{padding:10px;border-radius:11px;background:#edf0e8;color:#596055;font-size:12px}.sizes{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.size{border:1px solid #d8dcd2;border-radius:10px;padding:9px 11px;background:var(--card);color:var(--text)}.size[disabled]{opacity:.4;text-decoration:line-through}.size.selected{background:var(--button);color:var(--button-text)}.order,.close{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700}.order{background:var(--button);color:var(--button-text)}.order:disabled{opacity:.45}.close{background:transparent;color:var(--muted);margin-top:4px}.error{color:#a22}@media(min-width:640px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><header><div class="eyebrow">ANASTASIIA BUYER · ON RUNNING</div><h1>Кроссовки под заказ</h1><p class="intro">Выберите модель и размер. Наличие и доставка подтверждаются лично перед оплатой.</p></header><main id="catalog"><div class="empty">Загружаем каталог…</div></main><dialog id="detail"></dialog><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const BASE="https://dbgcpgteuwkxqjgvppfp.supabase.co/functions/v1/telegram-storefront";const root=document.getElementById("catalog"),dialog=document.getElementById("detail");let selected=null;const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(query,options={}){const response=await fetch(BASE+query,{...options,headers:{"Content-Type":"application/json","x-telegram-init-data":tg?.initData||"",...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||"Не удалось выполнить запрос");return body}function card(p){return '<button class="card" data-id="'+p.id+'"><img loading="lazy" src="'+esc(p.imageUrl)+'" alt=""><div class="copy"><div class="brand">'+esc(p.brand)+'</div><h2>'+esc(p.name)+'</h2><div class="price">€ '+Number(p.priceEur).toLocaleString("ru-RU")+'</div><span class="tag">Под заказ</span></div></button>'}
async function load(){try{if(!tg?.initData)throw new Error("Откройте каталог через кнопку в Telegram");const data=await api("?action=catalog&brand=On&limit=200");root.innerHTML=data.items.length?data.items.map(card).join(""):'<div class="empty">Сейчас нет доступных моделей.</div>';root.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openProduct(el.dataset.id));const requested=Number(tg?.initDataUnsafe?.start_param||new URLSearchParams(location.search).get("product"));if(Number.isSafeInteger(requested)&&requested>0)await openProduct(requested)}catch(e){root.innerHTML='<div class="empty error">'+esc(e.message)+'</div>'}}
async function openProduct(id){try{const p=await api("?action=product&id="+encodeURIComponent(id));selected=null;const sizes=(p.sizes||[]).map(s=>'<button class="size" data-size="'+esc(s.value)+'" '+(s.orderable?'':'disabled')+'>'+esc(s.value)+'</button>').join("");dialog.innerHTML='<div class="detail"><img class="hero" src="'+esc(p.imageUrl)+'" alt=""><div class="brand">'+esc(p.brand)+'</div><h2>'+esc(p.name)+'</h2><div class="price">€ '+Number(p.priceEur).toLocaleString("ru-RU")+'</div><p>'+esc(p.description||"")+'</p><div class="notice">Товар приобретается после вашего запроса. Срок и доставка подтверждаются отдельно.</div><div class="sizes">'+sizes+'</div><button class="order" '+(sizes?'disabled':'')+'>'+(sizes?'Выберите размер':'Отправить запрос')+'</button><button class="close">Закрыть</button></div>';dialog.querySelectorAll(".size:not([disabled])").forEach(el=>el.onclick=()=>{dialog.querySelectorAll(".size").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selected=el.dataset.size;const order=dialog.querySelector(".order");order.disabled=false;order.textContent="Заказать размер "+selected});dialog.querySelector(".order").onclick=()=>order(p.id);dialog.querySelector(".close").onclick=()=>dialog.close();dialog.showModal()}catch(e){tg?.showAlert(e.message)}}async function order(productId){try{await api("?action=request",{method:"POST",body:JSON.stringify({productId,size:selected})});tg?.showAlert("Запрос отправлен. Анастасия подтвердит наличие, срок и доставку.");dialog.close()}catch(e){tg?.showAlert(e.message)}}load();
</script></body></html>
