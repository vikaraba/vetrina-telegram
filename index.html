<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f3">
  <title>Каталог</title>
  <link rel="stylesheet" href="./style.css?v=20260926">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="./app.js?v=20260926-order-post"></script>
</head>
<body>
  <main id="app"><div class="loading-state" role="status"><span class="spinner"></span>Загружаем каталог…</div></main>
  <footer class="site-footer"><button class="icon-button" id="theme" aria-label="Переключить на тёмную тему"></button></footer>
  <dialog id="filters-dialog" class="sheet" aria-labelledby="filters-title"><form method="dialog" class="sheet-shell"><div class="sheet-head"><h2 id="filters-title">Фильтры</h2><button class="icon-button" value="cancel" aria-label="Закрыть фильтры">×</button></div><div id="filter-fields" class="sheet-content"></div><div class="sheet-bottom"><button type="button" class="text-button" id="filters-reset">Сбросить</button><button type="button" class="primary" id="filters-apply">Показать товары</button></div></form></dialog>
  <dialog id="size-dialog" class="size-dialog" aria-labelledby="size-title">
    <div class="sheet-head"><h2 id="size-title">Выберите размер</h2><button class="icon-button" data-close="size-dialog" aria-label="Закрыть выбор размера">×</button></div>
    <div class="size-context" id="size-context"></div>
    <div class="wheel-label"><span id="size-unit">EU</span><span>Прокрутите или нажмите</span></div>
    <div class="wheel-shell"><div class="wheel-selection" aria-hidden="true"></div><div id="size-wheel" class="size-wheel" role="listbox" tabindex="0" aria-label="Размер" aria-describedby="wheel-help"></div><div class="wheel-buttons"><button id="size-up" class="icon-button" aria-label="Предыдущий размер">↑</button><button id="size-down" class="icon-button" aria-label="Следующий размер">↓</button></div></div>
    <p id="wheel-help" class="sr-only">Выберите размер прокруткой или стрелками. Enter — проверить наличие, Escape — закрыть без изменений.</p>
    <div class="size-sheet-bottom"><button id="size-confirm" class="primary full" disabled>Выберите размер</button><small>Проверим наличие выбранного размера</small></div>
  </dialog>
  <dialog id="zoom-dialog" class="zoom-dialog" aria-label="Просмотр фотографий"><div class="zoom-toolbar"><span id="zoom-caption"></span><button class="icon-button" data-close="zoom-dialog" aria-label="Закрыть увеличение">×</button></div><div id="zoom-stage"><img id="zoom-image" alt=""></div><div class="zoom-controls"><button class="icon-button" id="zoom-minus" aria-label="Уменьшить фото">−</button><button id="zoom-reset" aria-label="Сбросить масштаб">100%</button><button class="icon-button" id="zoom-plus" aria-label="Увеличить фото">+</button><span>Двойное касание — увеличить</span></div></dialog>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
</body>
</html>
