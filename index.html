<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ON · Anastasiia Buyer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:var(--tg-theme-bg-color,#f6f6f1);--text:var(--tg-theme-text-color,#171814);--muted:var(--tg-theme-hint-color,#72766d);--card:var(--tg-theme-secondary-bg-color,#fff);--button:var(--tg-theme-button-color,#171814);--button-text:var(--tg-theme-button-text-color,#fff);--line:#d8dcd2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:24px 16px 18px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted)}h1{margin:6px 0;font-size:28px;line-height:1}.intro{margin:0;color:var(--muted)}main{padding:0 12px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{border:0;border-radius:16px;background:var(--card);padding:0;overflow:hidden;text-align:left;color:inherit}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff}.copy{padding:11px}.brand{font-size:10px;letter-spacing:.1em;color:var(--muted)}h2{font-size:13px;line-height:1.25;margin:4px 0 7px}.price{font-size:17px;font-weight:750}.tag{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:999px;background:#edf0e8;font-size:10px;color:#596055}.empty{grid-column:1/-1;padding:44px 14px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;width:min(94vw,520px);max-height:90vh;color:var(--text);background:var(--card)}dialog::backdrop{background:#0008}.detail{padding:17px}.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:88%;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:14px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:13px;scroll-snap-align:start}.notice{padding:10px;border-radius:11px;background:#edf0e8;color:#596055;font-size:12px}.sizes{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.size{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);color:var(--text)}.size[disabled]{opacity:.4;text-decoration:line-through}.size.selected{background:var(--button);color:var(--button-text)}.order,.close{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700}.order{background:var(--button);color:var(--button-text)}.order:disabled{opacity:.45}.close{background:transparent;color:var(--muted);margin-top:4px}.error{color:#a22}main.single-product{display:block;padding:0 12px 28px}.single-product .detail{max-width:560px;margin:0 auto;background:var(--card);border-radius:18px}.single-product h2{font-size:23px}.single-product .close{display:none}@media(min-width:640px){main:not(.single-product){grid-template-columns:repeat(3,minmax(0,1fr))}.gallery{grid-auto-columns:70%}}
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">ANASTASIIA BUYER · ON RUNNING</div>
    <h1 id="title">Кроссовки под заказ</h1>
    <p class="intro" id="intro">Выберите модель и размер. Наличие и доставка подтверждаются лично перед оплатой.</p>
  </header>
  <main id="catalog"><div class="empty">Загружаем каталог…</div></main>
  <dialog id="detail"></dialog>
  <script>
    const tg=window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();
    const BASE="https://dbgcpgteuwkxqjgvppfp.supabase.co/functions/v1/telegram-storefront";
    const root=document.getElementById("catalog");
    const dialog=document.getElementById("detail");
    const title=document.getElementById("title");
    const intro=document.getElementById("intro");
    const pageSessionId=crypto.randomUUID?.()||String(Date.now())+"-"+Math.random().toString(16).slice(2);
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    function clientContext(){
      const screenInfo=window.screen||{};
      return {
        schema_version:"telegram-webapp-client-v1",
        captured_at:new Date().toISOString(),
        page_session_id:pageSessionId,
        trust:"client_reported",
        telegram_web_app:{
          platform:tg?.platform??null,
          version:tg?.version??null,
          color_scheme:tg?.colorScheme??null,
          theme_params:tg?.themeParams??null,
          viewport_height:tg?.viewportHeight??null,
          viewport_stable_height:tg?.viewportStableHeight??null,
          is_active:tg?.isActive??null,
          is_expanded:tg?.isExpanded??null,
          is_fullscreen:tg?.isFullscreen??null,
          is_orientation_locked:tg?.isOrientationLocked??null,
          is_closing_confirmation_enabled:tg?.isClosingConfirmationEnabled??null,
          is_vertical_swipes_enabled:tg?.isVerticalSwipesEnabled??null,
          safe_area_inset:tg?.safeAreaInset??null,
          content_safe_area_inset:tg?.contentSafeAreaInset??null
        },
        runtime:{
          language:navigator.language??null,
          languages:Array.from(navigator.languages||[]),
          time_zone:Intl.DateTimeFormat().resolvedOptions().timeZone??null,
          user_agent:navigator.userAgent??null,
          screen_width:screenInfo.width??null,
          screen_height:screenInfo.height??null,
          device_pixel_ratio:window.devicePixelRatio??null
        }
      };
    }

    async function api(query,options={}){
      const response=await fetch(BASE+query,{...options,headers:{
        "Content-Type":"application/json",
        "x-telegram-init-data":tg?.initData||"",
        "x-telegram-client-context":JSON.stringify(clientContext()),
        ...(options.headers||{})
      }});
      const body=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(body.error||"Не удалось выполнить запрос");
      return body;
    }

    function requestedProductId(){
      const raw=String(tg?.initDataUnsafe?.start_param||new URLSearchParams(location.search).get("tgWebAppStartParam")||"");
      const match=/^product_([1-9][0-9]*)$/.exec(raw);
      const id=match?Number(match[1]):NaN;
      return Number.isSafeInteger(id)?id:null;
    }

    function card(product){
      return '<button class="card" data-id="'+product.id+'"><img loading="lazy" src="'+esc(product.imageUrl)+'" alt=""><div class="copy"><div class="brand">'+esc(product.brand)+'</div><h2>'+esc(product.name)+'</h2><div class="price">€ '+Number(product.priceEur).toLocaleString("ru-RU")+'</div><span class="tag">Под заказ</span></div></button>';
    }

    function productMarkup(product){
      const images=[...(product.imageUrls||[]),product.imageUrl].filter((url,index,all)=>url&&all.indexOf(url)===index);
      const gallery=images.map(url=>'<img src="'+esc(url)+'" alt="'+esc(product.name)+'">').join("");
      const sizes=(product.sizes||[]).map(size=>'<button class="size" data-size="'+esc(size.value)+'" '+(size.orderable?'':'disabled')+'>'+esc(size.value)+'</button>').join("");
      return '<div class="detail" data-product-id="'+product.id+'"><div class="gallery">'+gallery+'</div><div class="brand">'+esc(product.brand)+'</div><h2>'+esc(product.name)+'</h2><div class="price">€ '+Number(product.priceEur).toLocaleString("ru-RU")+'</div><p>'+esc(product.description||"")+'</p><div class="notice">Товар приобретается после вашего запроса. Срок и доставка подтверждаются отдельно.</div><div class="sizes">'+sizes+'</div><button class="order" '+(sizes?'disabled':'')+'>'+(sizes?'Выберите размер':'Отправить запрос')+'</button><button class="close">Закрыть</button></div>';
    }

    function activateProduct(container,product,standalone){
      let selected=null;
      const orderButton=container.querySelector(".order");
      container.querySelectorAll(".size:not([disabled])").forEach(element=>element.onclick=()=>{
        container.querySelectorAll(".size").forEach(candidate=>candidate.classList.remove("selected"));
        element.classList.add("selected");
        selected=element.dataset.size;
        orderButton.disabled=false;
        orderButton.textContent="Заказать размер "+selected;
      });
      orderButton.onclick=()=>requestProduct(product.id,selected,standalone);
      container.querySelector(".close").onclick=()=>dialog.close();
    }

    async function openProduct(id){
      try{
        const product=await api("?action=product&id="+encodeURIComponent(id));
        dialog.innerHTML=productMarkup(product);
        activateProduct(dialog,product,false);
        dialog.showModal();
      }catch(error){tg?.showAlert(error.message)}
    }

    async function openSingleProduct(id){
      const product=await api("?action=product&id="+encodeURIComponent(id));
      title.textContent="Проверьте размер";
      intro.textContent="Доступные размеры только для выбранной модели.";
      root.className="single-product";
      root.innerHTML=productMarkup(product);
      activateProduct(root,product,true);
    }

    async function requestProduct(productId,size,standalone){
      try{
        await api("?action=request",{method:"POST",body:JSON.stringify({productId,size})});
        tg?.showAlert("Запрос отправлен. Анастасия подтвердит наличие, срок и доставку.");
        if(!standalone)dialog.close();
      }catch(error){tg?.showAlert(error.message)}
    }

    async function load(){
      try{
        if(!tg?.initData)throw new Error("Откройте каталог через кнопку в Telegram");
        const requested=requestedProductId();
        if(requested!==null){
          await openSingleProduct(requested);
          return;
        }
        const data=await api("?action=catalog&brand=On&limit=200");
        root.innerHTML=data.items.length?data.items.map(card).join(""):'<div class="empty">Сейчас нет доступных моделей.</div>';
        root.querySelectorAll("[data-id]").forEach(element=>element.onclick=()=>openProduct(element.dataset.id));
      }catch(error){root.innerHTML='<div class="empty error">'+esc(error.message)+'</div>'}
    }

    load();
  </script>
</body>
</html>
