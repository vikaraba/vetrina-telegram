<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Anastasiia Buyer · Каталог</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:var(--tg-theme-bg-color,#f4f2ed);--text:var(--tg-theme-text-color,#181813);--muted:var(--tg-theme-hint-color,#77766f);--card:var(--tg-theme-secondary-bg-color,#fff);--button:var(--tg-theme-button-color,#181813);--button-text:var(--tg-theme-button-text-color,#fff);--line:#dedbd2;--gold:#967143;--soft:#efeee8}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;padding-bottom:max(24px,env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.topbar{position:sticky;top:0;z-index:20;padding:max(14px,env(safe-area-inset-top)) 16px 13px;background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);backdrop-filter:blur(18px)}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--gold)}h1{margin:5px 0;font:500 30px/1.05 Georgia,serif;letter-spacing:-.035em}.intro{margin:0;color:var(--muted);font-size:13px}.filters{position:sticky;top:91px;z-index:15;padding:10px 12px;background:linear-gradient(var(--bg) 85%,transparent)}.search{display:flex;align-items:center;min-height:48px;padding:0 13px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 7px 20px #3027190c}.search input{width:100%;border:0;outline:0;background:transparent;font-size:16px}.chips{display:flex;gap:7px;overflow:auto;padding-top:8px;scrollbar-width:none}.chip{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);font-weight:750;white-space:nowrap}.chip.active{border-color:var(--text);background:var(--text);color:#fff}main{padding:4px 12px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{border:1px solid #322b2010;border-radius:20px;background:var(--card);padding:0;overflow:hidden;text-align:left;color:inherit;box-shadow:0 8px 24px #3027190d}.card:active{transform:scale(.985)}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff}.copy{padding:11px}.brand{font-size:9px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;color:var(--gold)}h2{font-size:13px;line-height:1.25;margin:4px 0 7px}.price{font-size:17px;font-weight:800}.tag{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:999px;background:var(--soft);font-size:10px;color:#5d5d55}.empty{grid-column:1/-1;padding:44px 14px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:24px;padding:0;width:min(94vw,560px);max-height:92vh;color:var(--text);background:var(--card)}dialog::backdrop{background:#0009;backdrop-filter:blur(5px)}.detail{padding:14px 17px 18px}.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:-2px -5px 14px;scrollbar-width:none}.gallery-button{position:relative;width:100%;border:0;background:#fff;padding:0;border-radius:17px;overflow:hidden;scroll-snap-align:center}.gallery img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}.zoom-hint{position:absolute;right:10px;bottom:10px;padding:7px 10px;border-radius:999px;background:#181813cc;color:#fff;font-size:11px;font-weight:750}.reference{margin:4px 0 10px;color:var(--muted);font-size:12px}.notice{padding:11px;border-radius:13px;background:var(--soft);color:#5d5d55;font-size:12px}.sizes{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.size{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--card);color:var(--text)}.size[disabled]{opacity:.4;text-decoration:line-through}.size.selected{background:var(--button);color:var(--button-text)}.size-status{min-height:22px;margin:0 0 10px;color:var(--muted);font-size:12px}.size-status.available{color:#247140}.size-status.unavailable,.size-status.failed{color:#963e2d}.order,.contact,.explore,.close{width:100%;min-height:48px;border:0;border-radius:14px;padding:13px;font-weight:800}.order{background:var(--button);color:var(--button-text)}.order:disabled{opacity:.45}.contact{margin-top:8px;background:#2aabee;color:#fff}.contact[hidden]{display:none}.explore{margin-top:8px;border:1px solid var(--line);background:#fff;color:var(--text)}.close{background:transparent;color:var(--muted);margin-top:4px}.error{color:#a22}main.single-product{display:block;padding:12px 12px 28px}.single-product .detail{max-width:560px;margin:0 auto;background:var(--card);border:1px solid #322b2010;border-radius:24px;box-shadow:0 8px 30px #30271910}.single-product h2{font-size:23px}.single-product .close{display:none}.zoom-dialog{width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;border-radius:0;background:#0d0e0c;color:#fff}.zoom-stage{display:grid;place-items:center;width:100%;height:calc(100dvh - 74px);overflow:hidden;touch-action:none}.zoom-stage img{width:100%;height:100%;object-fit:contain;transform:translate3d(var(--tx,0px),var(--ty,0px),0) scale(var(--scale,1));will-change:transform;user-select:none;-webkit-user-drag:none}.zoom-bar{display:flex;align-items:center;justify-content:space-between;height:74px;padding:8px 14px max(8px,env(safe-area-inset-bottom));background:#171916}.zoom-bar button{min-width:46px;height:46px;border:1px solid #454842;border-radius:14px;background:#252824;color:#fff;font-size:22px}.zoom-bar span{font-size:11px;color:#d3d5d0;text-align:center}@media(min-width:640px){main:not(.single-product){grid-template-columns:repeat(3,minmax(0,1fr))}.gallery{grid-auto-columns:82%}.filters{top:100px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="eyebrow">ANASTASIIA BUYER</div>
    <h1 id="title">Персональный каталог</h1>
    <p class="intro" id="intro">Официальные фото, цены и личная проверка наличия.</p>
  </header>
  <section class="filters" id="filters" hidden><label class="search"><input id="search" type="search" placeholder="Бренд, модель или артикул" autocomplete="off"></label><div class="chips" id="brands"></div></section>
  <main id="catalog"><div class="empty">Загружаем каталог…</div></main>
  <dialog id="detail"></dialog>
  <dialog class="zoom-dialog" id="zoom"><div class="zoom-stage" id="zoomStage"><img id="zoomImage" alt=""></div><div class="zoom-bar"><button id="zoomOut" aria-label="Уменьшить">−</button><span>Щипок или двойное касание для масштаба</span><button id="zoomIn" aria-label="Увеличить">+</button><button id="zoomClose" aria-label="Закрыть">×</button></div></dialog>
  <script>
    const tg=window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();
    const BASE="https://dbgcpgteuwkxqjgvppfp.supabase.co/functions/v1/telegram-storefront";
    const root=document.getElementById("catalog");
    const dialog=document.getElementById("detail");
    const filters=document.getElementById("filters");
    const search=document.getElementById("search");
    const brands=document.getElementById("brands");
    const zoom=document.getElementById("zoom");
    const zoomImage=document.getElementById("zoomImage");
    const zoomStage=document.getElementById("zoomStage");
    const title=document.getElementById("title");
    const intro=document.getElementById("intro");
    let catalogItems=[];
    let activeBrand="Все";
    let currentProduct=null;
    function randomUuid(){
      if(typeof crypto.randomUUID==="function")return crypto.randomUUID();
      const bytes=crypto.getRandomValues(new Uint8Array(16));
      bytes[6]=(bytes[6]&15)|64;
      bytes[8]=(bytes[8]&63)|128;
      const hex=Array.from(bytes,byte=>byte.toString(16).padStart(2,"0")).join("");
      return hex.slice(0,8)+"-"+hex.slice(8,12)+"-"+hex.slice(12,16)+"-"+hex.slice(16,20)+"-"+hex.slice(20);
    }
    const pageSessionId=randomUuid();
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    function clientContext(){
      const screenInfo=window.screen||{};
      return {
        schema_version:"telegram-webapp-client-v1",
        captured_at:new Date().toISOString(),
        page_session_id:pageSessionId,
        trust:"client_reported",
        telegram_web_app:{
          platform:tg?.platform??null,
          version:tg?.version??null,
          color_scheme:tg?.colorScheme??null,
          theme_params:tg?.themeParams??null,
          viewport_height:tg?.viewportHeight??null,
          viewport_stable_height:tg?.viewportStableHeight??null,
          is_active:tg?.isActive??null,
          is_expanded:tg?.isExpanded??null,
          is_fullscreen:tg?.isFullscreen??null,
          is_orientation_locked:tg?.isOrientationLocked??null,
          is_closing_confirmation_enabled:tg?.isClosingConfirmationEnabled??null,
          is_vertical_swipes_enabled:tg?.isVerticalSwipesEnabled??null,
          safe_area_inset:tg?.safeAreaInset??null,
          content_safe_area_inset:tg?.contentSafeAreaInset??null
        },
        runtime:{
          language:navigator.language??null,
          languages:Array.from(navigator.languages||[]),
          time_zone:Intl.DateTimeFormat().resolvedOptions().timeZone??null,
          user_agent:navigator.userAgent??null,
          screen_width:screenInfo.width??null,
          screen_height:screenInfo.height??null,
          device_pixel_ratio:window.devicePixelRatio??null
        }
      };
    }

    async function api(query,options={}){
      const response=await fetch(BASE+query,{...options,headers:{
        "Content-Type":"application/json",
        "x-telegram-init-data":tg?.initData||"",
        "x-telegram-client-context":JSON.stringify(clientContext()),
        ...(options.headers||{})
      }});
      const body=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(body.error||"Не удалось выполнить запрос");
      return body;
    }

    function requestedProductId(){
      const raw=String(tg?.initDataUnsafe?.start_param||new URLSearchParams(location.search).get("tgWebAppStartParam")||"");
      const match=/^product_([1-9][0-9]*)$/.exec(raw);
      const id=match?Number(match[1]):NaN;
      return Number.isSafeInteger(id)?id:null;
    }

    function customerPrice(product){
      const amount=Number(product.priceAmount);
      const currency=String(product.priceCurrency||"").toUpperCase();
      if(!Number.isFinite(amount)||amount<=0||currency!=="RUB")return "Цена уточняется";
      return new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB",maximumFractionDigits:0}).format(amount);
    }

    const eventId=randomUuid;
    const delay=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));

    function card(product){
      return '<button class="card" data-id="'+product.id+'"><img loading="lazy" src="'+esc(product.imageUrl)+'" alt=""><div class="copy"><div class="brand">'+esc(product.brand)+'</div><h2>'+esc(product.name)+'</h2><div class="price">'+esc(customerPrice(product))+'</div><span class="tag">Под заказ</span></div></button>';
    }

    function productMarkup(product){
      const images=[...(product.imageUrls||[]),product.imageUrl].filter((url,index,all)=>url&&all.indexOf(url)===index);
      const gallery=images.map((url,index)=>'<button class="gallery-button" data-zoom="'+index+'" aria-label="Увеличить фото '+(index+1)+'"><img src="'+esc(url)+'" alt="'+esc(product.name)+', фото '+(index+1)+'"><span class="zoom-hint">⌕ Увеличить</span></button>').join("");
      const sizes=(product.sizes||[]).map(size=>'<button class="size" data-size="'+esc(size.value)+'" '+(size.selectable===true?'':'disabled')+'>'+esc(size.value)+'</button>').join("");
      const notice=sizes?'Выберите интересующий размер. Мы проверим фактическое наличие на официальном сайте ON.':'Товар приобретается после вашего запроса. Наличие, срок и доставка подтверждаются лично.';
      return '<div class="detail" data-product-id="'+product.id+'"><div class="gallery">'+gallery+'</div><div class="brand">'+esc(product.brand)+'</div><h2>'+esc(product.name)+'</h2><div class="reference">Артикул '+esc(product.reference||product.id)+'</div><div class="price">'+esc(customerPrice(product))+'</div><p>'+esc(product.description||"")+'</p><div class="notice">'+notice+'</div><div class="sizes">'+sizes+'</div><p class="size-status" aria-live="polite"></p><button class="order" '+(sizes?'disabled':'')+'>'+(sizes?'Выберите размер':'Уточнить наличие')+'</button><button class="contact" '+(sizes?'hidden':'')+'>Написать Анастасии</button><button class="explore">Найти другой товар</button><button class="close">Закрыть</button></div>';
    }

    function activateProduct(container,product,standalone){
      currentProduct=product;
      let selected=null;
      const orderButton=container.querySelector(".order");
      const status=container.querySelector(".size-status");
      const contactButton=container.querySelector(".contact");
      container.querySelectorAll(".size:not([disabled])").forEach(element=>element.onclick=()=>{
        container.querySelectorAll(".size").forEach(candidate=>candidate.classList.remove("selected"));
        element.classList.add("selected");
        selected=element.dataset.size;
        orderButton.disabled=false;
        orderButton.textContent="Проверить размер "+selected;
        status.textContent="";
        status.className="size-status";
        contactButton.hidden=true;
      });
      orderButton.onclick=()=>product.sizes?.length?requestProduct(product,selected,container,standalone):contactAnastasia(product,null);
      contactButton.onclick=()=>contactAnastasia(product,selected);
      container.querySelector(".explore").onclick=()=>{if(dialog.open)dialog.close();loadCatalog(true)};
      container.querySelector(".close").onclick=()=>dialog.close();
      container.querySelectorAll("[data-zoom]").forEach(button=>button.onclick=()=>openZoom(imagesFor(product)[Number(button.dataset.zoom)]));
    }

    async function openProduct(id){
      try{
        const product=await api("?action=product&id="+encodeURIComponent(id));
        dialog.innerHTML=productMarkup(product);
        activateProduct(dialog,product,false);
        dialog.showModal();
      }catch(error){tg?.showAlert(error.message)}
    }

    async function openSingleProduct(id){
      const product=await api("?action=product&id="+encodeURIComponent(id));
      title.textContent=product.brand||"Выбранный товар";
      intro.textContent="Все официальные фотографии выбранной модели.";
      filters.hidden=true;
      root.className="single-product";
      root.innerHTML=productMarkup(product);
      activateProduct(root,product,true);
    }

    async function requestProduct(product,size,container,standalone){
      if(!size)return;
      const orderButton=container.querySelector(".order");
      const status=container.querySelector(".size-status");
      const contactButton=container.querySelector(".contact");
      try{
        orderButton.disabled=true;
        status.className="size-status";
        status.textContent="Проверяем размер "+size+" на официальном сайте ON. Обычно это занимает несколько секунд.";
        const queued=await api("?action=size-interest",{method:"POST",body:JSON.stringify({productId:product.id,size,eventId:eventId()})});
        let result=queued;
        for(let attempt=0;attempt<20&&!['available','unavailable','unknown','failed'].includes(result.status);attempt+=1){
          await delay(1500);
          result=await api("?action=size-status&checkId="+encodeURIComponent(queued.checkId));
        }
        status.textContent=result.message||"Запрос сохранён. Напишите Анастасии, чтобы проверить размер вручную.";
        status.className="size-status "+(result.status||"");
        contactButton.hidden=!['available','unknown','failed'].includes(result.status);
        orderButton.disabled=false;
        orderButton.textContent="Проверить размер "+size;
        if(result.status==='available')tg?.HapticFeedback?.notificationOccurred?.("success");
        if(!standalone&&result.status==='available')tg?.showAlert(result.message);
      }catch(error){
        orderButton.disabled=false;
        status.className="size-status failed";
        status.textContent=error.message;
      }
    }

    async function contactAnastasia(product,size){
      try{
        await api("?action=interaction",{method:"POST",body:JSON.stringify({
          productId:product.id,interactionName:"contact_anastasia_opened",eventId:eventId(),details:{size:size||null}
        })});
      }catch{}
      const reference=String(product.reference||product.id);
      const message="Здравствуйте, Анастасия!\nХочу уточнить заказ: "+String(product.brand||"")+" — "+String(product.name||"")+"."+(size?"\nРазмер: "+size:"")+"\nАртикул: "+reference;
      const url="https://t.me/buyer_rome?text="+encodeURIComponent(message);
      if(tg?.openTelegramLink)tg.openTelegramLink(url);else location.href=url;
    }

    function imagesFor(product){return[...(product.imageUrls||[]),product.imageUrl].filter((url,index,all)=>url&&all.indexOf(url)===index)}

    function renderCatalog(){
      const query=search.value.trim().toLocaleLowerCase("ru-RU");
      const visible=catalogItems.filter(product=>(activeBrand==="Все"||product.brand===activeBrand)&&(!query||`${product.brand} ${product.name} ${product.reference||""}`.toLocaleLowerCase("ru-RU").includes(query)));
      brands.innerHTML=["Все",...new Set(catalogItems.map(product=>product.brand).filter(Boolean))].map(brand=>'<button class="chip '+(brand===activeBrand?'active':'')+'" data-brand="'+esc(brand)+'">'+esc(brand)+'</button>').join("");
      brands.querySelectorAll("[data-brand]").forEach(button=>button.onclick=()=>{activeBrand=button.dataset.brand;renderCatalog()});
      root.innerHTML=visible.length?visible.map(card).join(""):'<div class="empty">По этому запросу ничего не найдено.</div>';
      root.querySelectorAll("[data-id]").forEach(element=>element.onclick=()=>openProduct(element.dataset.id));
    }

    async function loadCatalog(fromProduct=false){
      title.textContent="Персональный каталог";intro.textContent="Официальные фото, цены и личная проверка наличия.";filters.hidden=false;root.className="";root.innerHTML='<div class="empty">Загружаем каталог…</div>';
      const data=await api("?action=catalog&limit=100"+(fromProduct?"&explore=1":""));catalogItems=data.items||[];activeBrand="Все";search.value="";renderCatalog();
    }

    let scale=1,tx=0,ty=0,startX=0,startY=0,startTx=0,startTy=0,startDistance=0,startScale=1;const pointers=new Map();
    function applyZoom(){zoomImage.style.setProperty("--scale",scale);zoomImage.style.setProperty("--tx",tx+"px");zoomImage.style.setProperty("--ty",ty+"px")}
    function setScale(value){scale=Math.max(1,Math.min(4,value));if(scale===1){tx=0;ty=0}applyZoom()}
    function openZoom(url){if(!url)return;zoomImage.src=url;zoomImage.alt=currentProduct?.name||"";setScale(1);zoom.showModal()}
    document.getElementById("zoomClose").onclick=()=>zoom.close();document.getElementById("zoomIn").onclick=()=>setScale(scale+.5);document.getElementById("zoomOut").onclick=()=>setScale(scale-.5);zoomStage.ondblclick=()=>setScale(scale>1?1:2.5);
    zoomStage.addEventListener("pointerdown",event=>{zoomStage.setPointerCapture(event.pointerId);pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});startX=event.clientX;startY=event.clientY;startTx=tx;startTy=ty;if(pointers.size===2){const values=[...pointers.values()];startDistance=Math.hypot(values[0].x-values[1].x,values[0].y-values[1].y);startScale=scale}});
    zoomStage.addEventListener("pointermove",event=>{if(!pointers.has(event.pointerId))return;pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});if(pointers.size===2){const values=[...pointers.values()];setScale(startScale*Math.hypot(values[0].x-values[1].x,values[0].y-values[1].y)/Math.max(1,startDistance))}else if(scale>1){tx=startTx+event.clientX-startX;ty=startTy+event.clientY-startY;applyZoom()}});["pointerup","pointercancel"].forEach(name=>zoomStage.addEventListener(name,event=>pointers.delete(event.pointerId)));
    search.addEventListener("input",renderCatalog);

    async function load(){
      try{
        if(!tg?.initData)throw new Error("Откройте каталог через кнопку в Telegram");
        const requested=requestedProductId();
        if(requested!==null){
          await openSingleProduct(requested);
          return;
        }
        await loadCatalog(false);
      }catch(error){root.innerHTML='<div class="empty error">'+esc(error.message)+'</div>'}
    }

    load();
  </script>
</body>
</html>
